```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Officer - CivicReport</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
            padding: 9px 15px;
            border-radius: 6px;
            background: #374151;
        }

        .navbar a:hover {
            background: #4b5563;
        }

        .container {
            max-width: 750px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .card h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-btn {
            background: #2563eb;
            color: white;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        .cancel-btn {
            background: #e5e7eb;
            color: #111827;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: bold;
        }

        .cancel-btn:hover {
            background: #d1d5db;
        }

        .required {
            color: red;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 15px;
                flex-direction: column;
                gap: 12px;
            }

            .navbar a {
                display: inline-block;
            }

            .card {
                padding: 20px;
            }

            .buttons {
                flex-direction: column;
            }

            button,
            .cancel-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">

        <h2>🚧 CivicReport</h2>

        <div>
            <a href="{{ url_for('admin_dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('officer_management') }}">
                Officers
            </a>

            <a href="{{ url_for('admin_logout') }}">
                Logout
            </a>
        </div>

    </div>


    <div class="container">

        <div class="card">

            <h1>Add New Officer</h1>

            <p class="subtitle">
                Enter the officer's details below.
            </p>


            <form method="POST"
                  action="{{ url_for('add_officer') }}">


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Officer Name
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter officer name"
                        required
                    >

                </div>


                <!-- DEPARTMENT -->

                <div class="form-group">

                    <label for="department">
                        Department
                        <span class="required">*</span>
                    </label>

                    <select
                        id="department"
                        name="department"
                        required
                    >

                        <option value="">
                            Select Department
                        </option>

                        <option value="Roads & Engineering">
                            Roads & Engineering
                        </option>

                        <option value="Electrical">
                            Electrical
                        </option>

                        <option value="Drainage">
                            Drainage
                        </option>

                        <option value="Water Supply">
                            Water Supply
                        </option>

                    </select>

                </div>


                <!-- BRANCH -->

                <div class="form-group">

                    <label for="branch">
                        Branch
                        <span class="required">*</span>
                    </label>

                    <select
                        id="branch"
                        name="branch"
                        required
                    >

                        <option value="">
                            Select Branch
                        </option>

                        <option value="North Branch">
                            North Branch
                        </option>

                        <option value="South Branch">
                            South Branch
                        </option>

                        <option value="Central Branch">
                            Central Branch
                        </option>

                    </select>

                </div>


                <!-- MOBILE -->

                <div class="form-group">

                    <label for="mobile">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        placeholder="Enter mobile number"
                        maxlength="10"
                    >

                </div>


                <!-- STATUS -->

                <div class="form-group">

                    <label for="status">
                        Status
                    </label>

                    <select
                        id="status"
                        name="status"
                    >

                        <option value="Active" selected>
                            Active
                        </option>

                        <option value="Inactive">
                            Inactive
                        </option>

                    </select>

                </div>


                <!-- BUTTONS -->

                <div class="buttons">

                    <button
                        type="submit"
                        class="save-btn"
                    >
                        ➕ Add Officer
                    </button>

                    <a
                        href="{{ url_for('officer_management') }}"
                        class="cancel-btn"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
```
