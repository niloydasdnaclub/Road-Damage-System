<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report a Problem - CivicReport</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #123c69;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .form-box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .location-box {
            display: flex;
            gap: 10px;
        }

        .location-box input {
            flex: 1;
        }

        .location-btn {
            border: none;
            background: #123c69;
            color: white;
            padding: 0 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        .location-status {
            margin-top: 8px;
            color: #555;
            font-size: 14px;
        }

        .submit-btn {
            width: 100%;
            margin-top: 30px;
            padding: 16px;
            border: none;
            border-radius: 8px;
            background: #e63946;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .required {
            color: red;
        }

        footer {
            text-align: center;
            background: #123c69;
            color: white;
            padding: 25px;
            margin-top: 40px;
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 8px;
            }

            .form-box {
                padding: 22px;
            }

            .location-box {
                flex-direction: column;
            }

            .location-btn {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>🚨 CivicReport</h1>

    <nav>
        <a href="/">Home</a>
        <a href="/report">Report Problem</a>
        <a href="/track">Track Complaint</a>
    </nav>

</header>


<div class="container">

    <div class="form-box">

        <h2>🚨 Report a Public Problem</h2>

        <p class="subtitle">
            Please provide accurate information about the problem.
        </p>


        <form method="POST" enctype="multipart/form-data">

            <!-- Citizen Details -->

            <label>
                Full Name <span class="required">*</span>
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required
            >


            <label>
                Mobile Number <span class="required">*</span>
            </label>

            <input
                type="tel"
                name="mobile"
                placeholder="Enter your mobile number"
                required
            >


            <label>
                Email Address
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email (optional)"
            >


            <label>
                Area / Address <span class="required">*</span>
            </label>

            <input
                type="text"
                name="address"
                placeholder="Enter the area or address"
                required
            >


            <!-- Location -->

            <label>
                📍 Problem Location <span class="required">*</span>
            </label>

            <div class="location-box">

                <input
                    <input
    type="text"
    id="location"
    name="location"
    placeholder="Latitude, Longitude"
    readonly
    required
>
                >

                <button
                    type="button"
                    class="location-btn"
                    onclick="getLocation()"
                >
                    📍 Use My Location
                </button>

            </div>

            <div
                id="locationStatus"
                class="location-status"
            >
                Location not selected.
            </div>


            <!-- Problem Type -->

            <label>
                ⚠️ Problem Type <span class="required">*</span>
            </label>

            <select name="problem_type" required>

                <option value="">
                    Select problem type
                </option>

                <option value="road_damage">
                    🛣️ Road Damage / Pothole
                </option>

                <option value="drainage">
                    🌊 Drainage Problem
                </option>

                <option value="street_light">
                    💡 Street Light Problem
                </option>

                <option value="water_leakage">
                    🚰 Water Leakage
                </option>

                <option value="garbage">
                    🗑️ Garbage / Waste
                </option>

                <option value="bridge_damage">
                    🌉 Bridge / Culvert Damage
                </option>

                <option value="fallen_tree">
                    🌳 Fallen Tree / Obstruction
                </option>

                <option value="other">
                    ⚠️ Other
                </option>

            </select>


            <!-- Description -->

            <label>
                📝 Problem Description <span class="required">*</span>
            </label>

            <textarea
                name="description"
                placeholder="Describe the problem in detail..."
                required
            ></textarea>


            <!-- Photo -->

            <label>
                📸 Upload Photo <span class="required">*</span>
            </label>

            <input
                type="file"
                name="photo"
                accept="image/*"
                required
            >


            <!-- Video -->

            <label>
                🎥 Upload Video
            </label>

            <input
                type="file"
                name="video"
                accept="video/*"
            >


            <button
                type="submit"
                class="submit-btn"
            >
                🚨 Submit Complaint
            </button>

        </form>

    </div>

</div>


<footer>

    © 2026 CivicReport — Public Infrastructure Complaint System

</footer>


<script>

function getLocation() {

    const status =
        document.getElementById("locationStatus");

    const locationInput =
        document.getElementById("location");


    if (!navigator.geolocation) {

        status.innerText =
            "❌ Geolocation is not supported by your browser.";

        return;
    }


    status.innerText =
        "📍 Getting your location...";


    navigator.geolocation.getCurrentPosition(

        function(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;


            locationInput.value =
                latitude + ", " + longitude;


            status.innerText =
                "✅ Location captured successfully.";

        },


        function(error) {

            status.innerText =
                "❌ Unable to get location. Please allow location permission.";

        }

    );

}

</script>

</body>
</html>
